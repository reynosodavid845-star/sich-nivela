{% extends "base.html" %}
{% block contenido %}
<section class="tarjeta">
  <h1>{{ titulo }}</h1>
  <h2>Resumen de la operación</h2>
  <dl>
    {% for etiqueta, valor in resumen %}<dt>{{ etiqueta }}</dt><dd>{{ valor }}</dd>{% endfor %}
  </dl>
  <p class="pregunta">¿Confirmar operación?</p>
  <form method="post" class="acciones-confirmar">
    <input type="hidden" name="token" value="{{ token }}">
    {% for nombre, valor in valores.items() %}
      <input type="hidden" name="{{ nombre }}" value="{{ valor }}">
    {% endfor %}
    <button class="boton-grande" type="submit" name="paso" value="guardar" data-enviando="Guardando...">S · Sí, confirmar</button>
    <button class="boton-grande secundario" type="submit" name="paso" value="cancelar">N · No, cancelar</button>
  </form>
</section>
{% endblock %}
